# Repos whose docs/ directory is published as part of this site.
# slug is the path it mounts at, and must also appear in website/content/_meta.js.
- repo: rammp-org/sheppy
  slug: sheppy
  title: sheppy
  assets: [install.sh]
  exclude: [superpowers, AGENTS.md, CLAUDE.md]
- repo: rammp-org/kinova-gen3-ros2
  slug: kinova-gen3-ros2
  title: Kinova Gen3 ROS 2
  # Beyond the default exclusions (superpowers, AGENTS.md, CLAUDE.md): the
  # on-robot runbook and the dated handoff notes are operational records, not
  # user-facing docs. They stay in the repo.
  # NOTE: overriding `exclude` REPLACES the default list, and compose.mjs errors
  # on a pattern that matches nothing -- so AGENTS.md/CLAUDE.md are omitted here
  # because this repo's docs/ has neither.
  exclude:
    - superpowers
    - on-robot-runbook.md
    - 2026-08-14-curobo-action-tier-handoff.md
    - 2026-08-14-jointconfig-preset-handoff.md
